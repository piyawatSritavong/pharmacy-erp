services:
  database:
    image: postgres:16-alpine
    container_name: pharmacy-erp-db
    environment:
      POSTGRES_DB: pharmacy_erp
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
    ports:
      - "${DATABASE_HOST_PORT:-5432}:5432"
    volumes:
      - pharmacy_erp_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy_erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  # serve no longer migrates on boot, so the schema and seed are their own step
  # here too — the same `migrate-and-seed` a fresh deployment runs once.
  migrator:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: pharmacy-erp-migrator
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://pharmacy:pharmacy@database:5432/pharmacy_erp?sslmode=disable
      SEED_POS_PASSWORD: "DevPassword123!"
      UPLOAD_DIR: /app/uploads
    command: ["./pharmacy-erp", "migrate-and-seed"]
    restart: "no"
    volumes:
      - pharmacy_erp_uploads:/app/uploads

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: pharmacy-erp-backend
    depends_on:
      database:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://pharmacy:pharmacy@database:5432/pharmacy_erp?sslmode=disable
      JWT_SECRET: pharmacy-erp-dev-secret
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_NAME: pharmacy_erp_auth
      COOKIE_SECURE: "false"
      DEFAULT_VAT_PCT: "7"
      ALLOW_OPERATIONAL_DATA_RESET: "false"
      ALLOW_MASTER_DATA_RESET: "false"
      SEED_POS_PASSWORD: "DevPassword123!"
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - pharmacy_erp_uploads:/app/uploads

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: pharmacy-erp-frontend
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}
      NODE_ENV: production
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

volumes:
  pharmacy_erp_db:
  pharmacy_erp_uploads:
