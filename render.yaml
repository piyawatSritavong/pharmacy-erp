# Render blueprint for Pharmacy ERP: the Go API and the Next.js frontend.
#
# The API serves and nothing else. Migrations run as preDeployCommand, which
# Render executes once per deploy before any new instance takes traffic — so the
# schema is in place before the first request and no two processes race each
# other through schema_migrations.
#
# The two services name each other, so neither URL can be filled in from here:
# the API's FRONTEND_URL is the web service's origin, and the web service's
# BACKEND_INTERNAL_URL is the API's. Apply the blueprint, let both services be
# created, then set all four sync:false values in the dashboard and redeploy.
services:
  - type: web
    name: pharmacy-erp-api
    runtime: docker
    dockerfilePath: deploy/backend.Dockerfile
    # The build context is the repo root: the Dockerfile copies backend/ from
    # there, and .dockerignore at the root is what keeps the context small.
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    preDeployCommand: "./pharmacy-erp migrate"
    autoDeploy: false
    envVars:
      # Set these in the Render dashboard. sync:false keeps the value out of the
      # repository and stops a blueprint apply from overwriting what is there.
      #
      # DATABASE_URL must be the Supabase transaction pooler on 6543, not a
      # direct 5432 connection. It needs no sslmode: the code defaults an
      # unspecified DSN to require, because lib/pq's own default is "prefer",
      # which drops to plaintext without saying so.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_ENV
        value: production
      # The web service's public origin, and the only origin CORS will allow
      # once APP_ENV is production. sync:false rather than a literal because the
      # value is not knowable until the web service exists: on a first deploy it
      # is https://pharmacy-erp-web.onrender.com, and it becomes the custom
      # domain only after that is attached. A stale literal here fails closed —
      # every cross-origin call refused, with nothing in the blueprint to say
      # why.
      - key: FRONTEND_URL
        sync: false
      # Host-only cookie. COOKIE_DOMAIN is deliberately absent — setting it
      # would widen the cookie across subdomains.
      # Product photographs live in a private Supabase Storage bucket. The
      # service role key bypasses RLS, which is the only way into a bucket with
      # no policies on it — treat it exactly as you would the database password.
      # SUPABASE_URL is https://<project-ref>.supabase.co.
      # Only `seed` reads these, and it is a one-off job rather than something
      # the service does at boot — but they belong beside the other secrets so
      # a one-off shell has them. No defaults: the seed refuses to run without
      # both, they must be at least 16 characters, and they must differ.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_POS_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COOKIE_NAME
        value: pharmacy_erp_auth
      - key: COOKIE_SECURE
        value: "true"
      - key: DEFAULT_VAT_PCT
        value: "7"
      # Every destructive path stays shut in production. Each of these is a
      # second lock on a command that also demands an explicit --confirm.
      - key: ALLOW_DESTRUCTIVE_SEED
        value: "false"
      - key: ALLOW_OPERATIONAL_DATA_RESET
        value: "false"
      - key: ALLOW_MASTER_DATA_RESET
        value: "false"

  - type: web
    name: pharmacy-erp-web
    runtime: docker
    dockerfilePath: deploy/frontend.Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    # NOT "/". Measured against the built image: / returns 307, because the
    # middleware redirects an unauthenticated visitor to the login page, and a
    # health check that never returns 2xx can leave the service permanently
    # unhealthy. /login renders 200, needs no session, and — verified with the
    # API container stopped — still returns 200 when the backend is down, which
    # is what a liveness probe for *this* service should do. The API has its
    # own /healthz.
    healthCheckPath: /login
    autoDeploy: false
    envVars:
      # The Go API's public URL, e.g. https://pharmacy-erp-api.onrender.com.
      # Set it in the dashboard once the API service exists and has one.
      #
      # BACKEND_INTERNAL_URL rather than NEXT_PUBLIC_API_URL: both are read
      # (backend-url.ts accepts three names), but this one comes first in the
      # chain, is what compose already sets so dev and production agree, and is
      # honestly named. The value is only ever read on the server — the browser
      # talks to /api/backend/* on its own origin and the Next route handler
      # forwards from there — so a NEXT_PUBLIC_ prefix would advertise a
      # client-bundle exposure that does not happen.
      - key: BACKEND_INTERNAL_URL
        sync: false
